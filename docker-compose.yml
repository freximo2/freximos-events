version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vibrameet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibrameet
      POSTGRES_PASSWORD: vibrameet_secret
      POSTGRES_DB: vibrameet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibrameet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibrameet_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vibrameet:vibrameet_secret@db:5432/vibrameet
      JWT_SECRET: super_secret_key_change_in_production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibrameet_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  pgdata:
  uploads_data:
